<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ code or 404 }} · Abhijeet Work Hub</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display:grid;place-items:center;min-height:100vh;padding:24px">
  <div style="text-align:center;max-width:460px">
    <div style="font-size:82px;font-weight:800;letter-spacing:-3px;
                background:linear-gradient(135deg,#6366f1,#22d3ee);
                -webkit-background-clip:text;background-clip:text;color:transparent">
      {{ code or 404 }}
    </div>
    <h1 style="font-size:22px;margin:10px 0 8px">{{ msg or 'Page not found.' }}</h1>
    <p style="color:#949bb3;font-size:14px;margin-bottom:24px">
      {{ 'That path is outside my workspace, so it is blocked.' if code == 403
         else 'The page you were looking for does not exist.' }}
    </p>
    <a class="btn primary" href="{{ url_for('index') }}">&#8592; Back to the hub</a>
  </div>
</body>
</html>
